<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goalie Tracker</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1565c0"><style>body{font-family:Arial,sans-serif;max-width:600px;margin:auto;padding:16px;background:#f4f6f8} .card{background:#fff;padding:16px;border-radius:12px;margin:10px 0} button{width:100%;padding:18px;margin:6px 0;font-size:22px;border:none;border-radius:10px}.shot{background:#1565c0;color:#fff}.goal{background:#c62828;color:#fff}.small{background:#ddd}.stat{font-size:42px;font-weight:bold}</style></head><body><h1>🏒 Goalie Tracker</h1><div class="card"><input id="opp" placeholder="Opponent" style="width:100%;padding:10px"></div><div class="card"><div>Shots</div><div id="shots" class="stat">0</div><button class="shot" onclick="addShot()">+ SHOT</button></div><div class="card"><div>Goals</div><div id="goals" class="stat">0</div><button class="goal" onclick="addGoal()">+ GOAL</button></div><div class="card"><div>Saves: <span id="saves">0</span></div><div>Save %: <span id="svp">1.000</span></div></div><div class="card"><button class="small" onclick="undo()">UNDO</button><button class="small" onclick="saveGame()">SAVE GAME</button></div><div class="card"><h3>Season Games</h3><div id="history"></div></div><script>let shots=0,goals=0,last='';function render(){let s=shots-goals;document.getElementById('shots').textContent=shots;document.getElementById('goals').textContent=goals;document.getElementById('saves').textContent=s;document.getElementById('svp').textContent=shots?(s/shots).toFixed(3):'1.000';loadHistory()}function addShot(){shots++;last='shot';render()}function addGoal(){shots++;goals++;last='goal';render()}function undo(){if(last==='shot'&&shots>0)shots--;if(last==='goal'&&shots>0&&goals>0){shots--;goals--;}render()}function saveGame(){const games=JSON.parse(localStorage.getItem('games')||'[]');games.push({date:new Date().toLocaleDateString(),opp:document.getElementById('opp').value||'Unknown',shots,goals});localStorage.setItem('games',JSON.stringify(games));shots=0;goals=0;render();}function loadHistory(){const games=JSON.parse(localStorage.getItem('games')||'[]');document.getElementById('history').innerHTML=games.map(g=>`${g.date} - ${g.opp} | ${g.shots} shots, ${g.goals} goals`).join('<br>')}if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js')}render();</script></body></html>
