<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Goalie Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#211f1b">
    <style>
      * { box-sizing: border-box; }
      :root {
        --logo-charcoal: #211f1b;
        --logo-burgundy: #801d24;
        --logo-gold: #d7c27b;
        --logo-cream: #ead4d2;
      }
      body {
        color-scheme: light;
        --page-background: var(--logo-cream);
        --surface-background: #fffaf0;
        --text-color: var(--logo-charcoal);
        --muted-button: #e8dfc4;
        font-family: Arial, sans-serif;
        width: min(100%, 632px);
        margin: auto;
        padding: 16px;
        background: var(--page-background);
        color: var(--text-color);
        transition: background-color 240ms ease, color 240ms ease;
      }
      body.dark-mode {
        color-scheme: dark;
        --page-background: var(--logo-charcoal);
        --surface-background: #302b27;
        --text-color: var(--logo-cream);
        --muted-button: var(--logo-gold);
      }
      .page-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .page-header img {
        width: 72px;
        height: 72px;
        flex: 0 0 auto;
        border-radius: 50%;
      }
      .page-header h1 {
        flex: 1;
        color: var(--text-color);
        font-size: clamp(24px, 7vw, 32px);
        transition: color 240ms ease;
      }
      .card {
        background: var(--surface-background);
        padding: 16px;
        border-radius: 12px;
        margin: 10px 0;
        border: 1px solid var(--logo-gold);
        color: var(--text-color);
        transition: background-color 240ms ease, border-color 240ms ease, color 240ms ease;
      }
      button {
        width: 100%;
        min-height: 48px;
        padding: 12px;
        margin: 6px 0;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        touch-action: manipulation;
        cursor: pointer;
        transition: background-color 240ms ease, color 240ms ease, border-color 240ms ease;
      }
      button:focus-visible, input:focus-visible {
        outline: 3px solid var(--logo-gold);
        outline-offset: 2px;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .shot { background: var(--logo-burgundy); color: #fff; }
      .goal { background: var(--logo-gold); color: var(--logo-charcoal); }
      .small { background: var(--muted-button); color: var(--logo-charcoal); }
      .theme-toggle {
        position: relative;
        width: 64px;
        height: 36px;
        min-height: 36px;
        flex: 0 0 64px;
        margin: 0;
        padding: 0;
        overflow: hidden;
        border: 2px solid var(--logo-burgundy);
        border-radius: 999px;
        background: var(--logo-cream);
        cursor: pointer;
        transition: background-color 240ms ease, border-color 240ms ease;
      }
      .theme-toggle::before {
        position: absolute;
        z-index: 1;
        top: 2px;
        left: 2px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--logo-burgundy);
        content: "";
        transition: transform 240ms ease, background-color 240ms ease;
      }
      .theme-toggle[aria-checked="true"] {
        border-color: var(--logo-gold);
        background: var(--logo-charcoal);
      }
      .theme-toggle[aria-checked="true"]::before {
        transform: translateX(28px);
        background: var(--logo-gold);
      }
      .theme-icon {
        position: absolute;
        z-index: 2;
        top: 50%;
        left: 4px;
        display: block;
        width: 24px;
        height: 24px;
        pointer-events: none;
        transform: translateY(-50%);
        transition: transform 240ms ease, color 240ms ease;
      }
      .theme-icon-moon { color: var(--logo-cream); }
      .theme-icon-sun { display: none; color: var(--logo-charcoal); }
      .theme-icon-sun svg { display: block; width: 18px; height: 18px; margin: 3px auto; }
      .theme-toggle[aria-checked="true"] .theme-icon-moon { display: none; }
      .theme-toggle[aria-checked="true"] .theme-icon-sun {
        display: block;
        transform: translate(28px, -50%);
      }
      .counter-adjustments { display: flex; gap: 8px; }
      .counter-adjustments button { flex: 1; width: 0; margin: 6px 0; }
      .stat {
        font-size: 42px;
        font-weight: bold;
        color: var(--logo-burgundy);
        transition: color 240ms ease;
      }
      body.dark-mode .stat { color: var(--logo-gold); }
      #history { min-width: 0; width: 100%; }
      .game-entry {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
        margin: 10px 0;
        padding: 12px;
        border: 1px solid var(--logo-gold);
        border-radius: 10px;
        background: var(--surface-background);
      }
      .game-details { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
      .game-title { display: block; margin-bottom: 5px; font-weight: bold; line-height: 1.35; }
      .game-stats, .game-periods { display: block; font-size: 14px; line-height: 1.5; }
      .game-periods { overflow-wrap: anywhere; }
      .game-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; }
      .game-actions button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: auto;
        min-width: 44px;
        min-height: 40px;
        padding: 6px 8px;
        margin: 0;
        border: 1px solid transparent;
        font-size: 12px;
      }
      .export-icon { display: block; width: 18px; height: 18px; flex: 0 0 18px; }
      .delete-game { min-width: 44px; padding: 6px 8px; font-size: 12px; }
      .period-controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .period-button {
        width: 100%;
        min-height: 44px;
        padding: 8px 10px;
        margin: 0;
        font-size: 16px;
        background: var(--muted-button);
        color: var(--logo-charcoal);
      }
      .period-button.active { background: var(--logo-burgundy); color: #fff; }
      .opponent-input {
        display: block;
        width: 100%;
        min-height: 48px;
        margin: 0 auto;
        padding: 12px;
        border: 1px solid var(--logo-gold);
        border-radius: 8px;
        background: var(--surface-background);
        color: var(--text-color);
        font: inherit;
        font-size: 16px;
        transition: background-color 240ms ease, color 240ms ease, border-color 240ms ease;
      }
      .opponent-input::placeholder { color: var(--text-color); opacity: 0.7; }
      @media (max-width: 520px) {
        body { padding: 10px; }
        .card { padding: 12px; }
        .page-header img { width: 60px; height: 60px; }
        .counter-adjustments { gap: 6px; }
        .game-entry { align-items: stretch; flex-direction: column; gap: 10px; }
        .game-actions { justify-content: flex-start; flex-wrap: wrap; }
      }
      @media (max-width: 340px) {
        .game-actions { gap: 4px; }
        .game-actions button { min-width: 40px; padding: 5px 6px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <header class="page-header">
      <img src="logo.png" alt="Dynamik Goaltending logo">
      <h1>Goalie Tracker</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Dark mode" aria-checked="false" onclick="toggleTheme()"><span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span><span class="theme-icon theme-icon-sun" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></span></button>
    </header>
    <div class="card">
      <input id="opp" class="opponent-input" placeholder="Opponent" aria-label="Opponent">
    </div>
    <div class="card">
      <div>Period</div>
      <div class="period-controls" aria-label="Select period">
        <button type="button" class="period-button active" data-period="1">P1</button>
        <button type="button" class="period-button" data-period="2">P2</button>
        <button type="button" class="period-button" data-period="3">P3</button>
      </div>
    </div>
    <div class="card">
      <div>Shots</div>
      <div id="shots" class="stat">0</div>
      <div class="counter-adjustments">
        <button class="shot" onclick="addShot()">+ SHOT</button>
        <button class="small" onclick="removeShot()">- SHOT</button>
      </div>
    </div>
    <div class="card">
      <div>Goals</div>
      <div id="goals" class="stat">0</div>
      <div class="counter-adjustments">
        <button id="add-goal" class="goal" onclick="addGoal()">+ GOAL</button>
        <button class="small" onclick="removeGoal()">- GOAL</button>
      </div>
    </div>
    <div class="card">
      <div>Saves: <span id="saves">0</span></div>
      <div>Save %: <span id="svp">1.000</span></div>
    </div>
    <div class="card">
      <button class="small" onclick="saveGame()">SAVE GAME</button>
    </div>
    <div class="card">
      <h3>Season Games</h3>
      <div id="history"></div>
      <button class="small" onclick="clearHistory()">CLEAR SEASON LOGS</button>
    </div>
    <script>
      const PERIOD_COUNT = 3;
      let currentPeriod = 1;
      let periods = Array.from({ length: PERIOD_COUNT }, () => ({ shots: 0, goals: 0 }));
      let shots = 0, goals = 0;

      function applyTheme(isDark) {
        if (!document.body) return;
        document.body.classList.toggle('dark-mode', isDark);
        const toggle = document.getElementById('theme-toggle');
        if (toggle) {
          toggle.setAttribute('aria-checked', String(isDark));
          toggle.setAttribute('aria-label', isDark ? 'Dark mode on' : 'Dark mode off');
        }
      }

      function toggleTheme() {
        const isDark = !document.body.classList.contains('dark-mode');
        applyTheme(isDark);
        localStorage.setItem('goalie-tracker-theme', isDark ? 'dark' : 'light');
      }

      function getCurrentPeriodStats() { return periods[currentPeriod - 1]; }

      function syncCurrentPeriodStats() {
        const stats = getCurrentPeriodStats();
        shots = stats.shots;
        goals = stats.goals;
      }

      function updatePeriodButtons() {
        document.querySelectorAll('.period-button').forEach((button) => {
          const isActive = Number(button.dataset.period) === currentPeriod;
          button.classList.toggle('active', isActive);
          button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
      }

      function setCurrentPeriod(periodNumber) {
        currentPeriod = Math.min(Math.max(1, periodNumber), PERIOD_COUNT);
        syncCurrentPeriodStats();
        updatePeriodButtons();
        render();
      }

      function render() {
        const stats = getCurrentPeriodStats();
        shots = stats.shots;
        goals = stats.goals;
        const saves = shots - goals;
        document.getElementById('shots').textContent = shots;
        document.getElementById('goals').textContent = goals;
        document.getElementById('saves').textContent = saves;
        document.getElementById('svp').textContent = shots ? (saves / shots).toFixed(3) : '0.000';
        document.getElementById('add-goal').disabled = goals >= shots;
        updatePeriodButtons();
        loadHistory();
      }

      function addShot() {
        const stats = getCurrentPeriodStats();
        stats.shots++;
        syncCurrentPeriodStats();
        render();
      }

      function addGoal() {
        const stats = getCurrentPeriodStats();
        if (stats.goals >= stats.shots) return;
        stats.goals++;
        syncCurrentPeriodStats();
        render();
      }

      function removeShot() {
        const stats = getCurrentPeriodStats();
        if (stats.shots > 0) {
          stats.shots--;
          if (stats.goals > stats.shots) stats.goals = stats.shots;
        }
        syncCurrentPeriodStats();
        render();
      }

      function removeGoal() {
        const stats = getCurrentPeriodStats();
        if (stats.goals > 0) stats.goals--;
        syncCurrentPeriodStats();
        render();
      }

      function resetCurrentGame() {
        periods = Array.from({ length: PERIOD_COUNT }, () => ({ shots: 0, goals: 0 }));
        currentPeriod = 1;
        syncCurrentPeriodStats();
        render();
      }

      function saveGame() {
        const games = JSON.parse(localStorage.getItem('games') || '[]');
        const gameShots = periods.reduce((total, period) => total + period.shots, 0);
        const gameGoals = periods.reduce((total, period) => total + period.goals, 0);
        games.push({
          date: new Date().toLocaleDateString(),
          opp: document.getElementById('opp').value || 'Unknown',
          shots: gameShots,
          goals: gameGoals,
          periods: periods.map((period, index) => ({ number: index + 1, shots: period.shots, goals: period.goals }))
        });
        localStorage.setItem('games', JSON.stringify(games));
        document.getElementById('opp').value = '';
        resetCurrentGame();
      }

      function loadHistory() {
        const games = JSON.parse(localStorage.getItem('games') || '[]');
        const history = document.getElementById('history');
        history.replaceChildren();
        if (!games.length) {
          history.textContent = 'No saved games yet.';
          return;
        }
        games.forEach((game, index) => {
          const entry = document.createElement('div');
          entry.className = 'game-entry';
          const details = document.createElement('div');
          details.className = 'game-details';
          const title = document.createElement('strong');
          title.className = 'game-title';
          title.textContent = `${game.date} · ${game.opp}`;
          const stats = document.createElement('span');
          stats.className = 'game-stats';
          stats.textContent = `${game.shots} shots · ${game.goals} goals · ${game.shots - game.goals} saves`;
          const gamePeriods = Array.isArray(game.periods) && game.periods.length ? game.periods : [{ number: 1, shots: game.shots, goals: game.goals }];
          const periodDetails = document.createElement('span');
          periodDetails.className = 'game-periods';
          periodDetails.textContent = gamePeriods.map(period => `P${period.number}: ${period.shots} shots, ${period.goals} goals`).join(' · ');
          details.append(title, stats, periodDetails);

          const actions = document.createElement('div');
          actions.className = 'game-actions';
          const downloadButton = document.createElement('button');
          downloadButton.className = 'small export-button';
          downloadButton.type = 'button';
          downloadButton.innerHTML = '<svg class="export-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg><span>CSV</span>';
          downloadButton.setAttribute('aria-label', `Export game against ${game.opp} on ${game.date} as CSV`);
          downloadButton.title = 'Export CSV';
          downloadButton.addEventListener('click', () => downloadGameCsv(game));
          const downloadJsonButton = document.createElement('button');
          downloadJsonButton.className = 'small export-button';
          downloadJsonButton.type = 'button';
          downloadJsonButton.innerHTML = '<svg class="export-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg><span>JSON</span>';
          downloadJsonButton.setAttribute('aria-label', `Export game against ${game.opp} on ${game.date} as JSON`);
          downloadJsonButton.title = 'Export JSON';
          downloadJsonButton.addEventListener('click', () => downloadGameJson(game));
          const deleteButton = document.createElement('button');
          deleteButton.className = 'small delete-game';
          deleteButton.type = 'button';
          deleteButton.textContent = 'DELETE';
          deleteButton.setAttribute('aria-label', `Delete game against ${game.opp} on ${game.date}`);
          deleteButton.addEventListener('click', () => deleteGame(index));
          actions.append(downloadButton, downloadJsonButton, deleteButton);
          entry.append(details, actions);
          history.append(entry);
        });
      }

      function downloadGameCsv(game) {
        const saves = game.shots - game.goals;
        const savePercentage = game.shots ? (saves / game.shots).toFixed(3) : '0.000';
        const gamePeriods = Array.isArray(game.periods) && game.periods.length ? game.periods : [{ number: 1, shots: game.shots, goals: game.goals }];
        const periodHeaders = gamePeriods.flatMap(period => [`P${period.number} Shots`, `P${period.number} Goals`]);
        const rows = [
          ['Date', 'Opponent', 'Shots', 'Goals', 'Saves', 'Save Percentage', ...periodHeaders],
          [game.date, game.opp, game.shots, game.goals, saves, savePercentage, ...gamePeriods.flatMap(period => [period.shots, period.goals])]
        ];
        const csv = rows.map(row => row.map(value => {
          const escaped = String(value).replace(/"/g, '""');
          return `"${escaped}"`;
        }).join(',')).join('\r\n');
        const blob = new Blob(['\uFEFF', csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const opponent = String(game.opp).trim().replace(/[^\w-]+/g, '-').replace(/^-|-$/g, '') || 'game';
        const date = String(game.date).replace(/[^\w-]+/g, '-');
        link.href = url;
        link.download = `${opponent}-${date}.csv`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function downloadGameJson(game) {
        const saves = game.shots - game.goals;
        const savePercentage = game.shots ? (saves / game.shots).toFixed(3) : '0.000';
        const gamePeriods = Array.isArray(game.periods) && game.periods.length ? game.periods : [{ number: 1, shots: game.shots, goals: game.goals }];
        const payload = {
          date: game.date,
          opp: game.opp,
          shots: game.shots,
          goals: game.goals,
          saves,
          savePercentage,
          periods: gamePeriods
        };
        const json = JSON.stringify(payload, null, 2);
        const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const opponent = String(game.opp).trim().replace(/[^\w-]+/g, '-').replace(/^-|-$/g, '') || 'game';
        const date = String(game.date).replace(/[^\w-]+/g, '-');
        link.href = url;
        link.download = `${opponent}-${date}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function deleteGame(index) {
        const games = JSON.parse(localStorage.getItem('games') || '[]');
        const game = games[index];
        if (!game) return;
        if (!confirm(`Delete the game against ${game.opp} on ${game.date}? This cannot be undone.`)) return;
        games.splice(index, 1);
        if (games.length) localStorage.setItem('games', JSON.stringify(games));
        else localStorage.removeItem('games');
        render();
      }

      function clearHistory() {
        const games = JSON.parse(localStorage.getItem('games') || '[]');
        if (!games.length) return;
        if (!confirm('Remove all saved season game logs? This cannot be undone.')) return;
        localStorage.removeItem('games');
        render();
      }

      document.querySelectorAll('.period-button').forEach((button) => {
        button.addEventListener('click', () => setCurrentPeriod(Number(button.dataset.period)));
      });

      applyTheme(localStorage.getItem('goalie-tracker-theme') === 'dark');
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
      render();
    </script>
  </body>
</html>
